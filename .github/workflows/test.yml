name: Test private Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run db:migrate:local
      - name: Local Worker smoke
        run: |
          pnpm run start > /tmp/sharetab-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -fsS http://localhost:8787/api/health >/dev/null; do sleep 1; done'
          pnpm run test:worker
      - run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
